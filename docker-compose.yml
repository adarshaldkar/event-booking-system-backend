services:
  # PostgreSQL — local development database
  postgres:
    image: postgres:16-alpine
    container_name: event_booking_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: event_booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: asd123
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis — local BullMQ broker and cache
  redis:
    image: redis:7-alpine
    container_name: event_booking_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
